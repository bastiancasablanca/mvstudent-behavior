<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>การ์ดบันทึกพฤติกรรมนักเรียน — โรงเรียนมารีวิทย์บ่อวิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<!-- ระบบแปลงหน้าการ์ดเป็นไฟล์รูปภาพ PNG ความคมชัดสูง -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --teal-dark: #0A3D3F;
    --teal-mid:  #0E5457;
    --teal-light:#167577;
    --gold:      #2FA8A0;
    --gold-soft: #5FC9C1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Sarabun', sans-serif;
    background: #EAF0EE;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  /* ปุ่มควบคุมด้านบน */
  .toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn-action {
    background: var(--teal-dark);
    color: #fff;
    border: none;
    padding: 10px 22px;
    border-radius: 12px;
    font-family: 'Sarabun', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(10,61,63,0.25);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-action:hover { background: var(--teal-mid); transform: translateY(-1px); }
  .btn-action.download { background: #18837B; }
  .btn-action.download:hover { background: #136B64; }

  /* ตัวการ์ด */
  #cardToExport {
    width: 380px;
    background: #FFFFFF;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 16px 44px rgba(10,61,63,0.16);
    border: 1.5px solid #C5DAD4;
    text-align: center;
  }

  .card-top {
    background: linear-gradient(145deg, var(--teal-dark), var(--teal-mid));
    color: #FFFFFF;
    padding: 22px 20px 18px;
    position: relative;
  }
  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.3);
    color: #E2F5F3;
    font-size: 11.5px;
    padding: 3px 12px;
    border-radius: 20px;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .card-top h1 { font-size: 18.5px; font-weight: 700; margin-bottom: 3px; }
  .card-top p { font-size: 13px; opacity: 0.92; color: #CDE9E5; }

  .card-body {
    padding: 22px 24px;
    background: #FAFCFB;
  }

  /* กรอบ QR Code */
  .qr-box {
    background: #FFFFFF;
    padding: 14px;
    border-radius: 18px;
    display: inline-block;
    border: 2px dashed #A3C9C2;
    box-shadow: 0 4px 14px rgba(0,0,0,0.04);
  }
  .qr-box img {
    width: 210px;
    height: 210px;
    display: block;
  }

  /* กล่องลิงก์ย่อ */
  .url-pill {
    margin-top: 14px;
    background: #EDF7F5;
    border: 1.5px solid #A2D8D1;
    padding: 8px 16px;
    border-radius: 12px;
    display: inline-block;
  }
  .url-pill span { font-size: 11px; color: #40756F; font-weight: 600; display: block; }
  .url-pill a {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14.5px;
    color: #0C4E48;
    text-decoration: none;
    font-weight: 600;
  }

  /* ขั้นตอนการใช้งาน */
  .steps-list {
    margin-top: 18px;
    text-align: left;
    background: #FFFFFF;
    border: 1px solid #E1ECE8;
    border-radius: 12px;
    padding: 12px 14px;
  }
  .step-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: #244242;
    margin-bottom: 6px;
  }
  .step-item:last-child { margin-bottom: 0; }
  .step-num {
    width: 19px;
    height: 19px;
    background: var(--gold);
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .card-footer {
    background: #F1F6F4;
    padding: 11px 16px;
    font-size: 11.5px;
    color: #557875;
    border-top: 1px solid #E2EBE8;
  }

  @media print {
    body { background: transparent; padding: 0; }
    .toolbar { display: none; }
    #cardToExport { box-shadow: none; border: 1px solid #999; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button class="btn-action download" onclick="saveAsImage()">💾 ดาวน์โหลดเป็นการ์ดรูปภาพ (PNG)</button>
  <button class="btn-action" onclick="window.print()">🖨️ พิมพ์การ์ด</button>
</div>

<!-- ส่วนของการ์ด -->
<div id="cardToExport">
  <div class="card-top">
    <div class="badge">ระบบฝ่ายกิจการนักเรียน</div>
    <h1>📋 บันทึกพฤติกรรมนักเรียน</h1>
    <p>โรงเรียนมารีวิทย์บ่อวิน</p>
  </div>

  <div class="card-body">
    <div class="qr-box">
      <!-- QR Code อัปเดตลิงก์ tinyurl.com/ye28a8hs คมชัดระดับ 300x300 -->
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Ftinyurl.com%2Fye28a8hs" alt="QR Code" crossorigin="anonymous">
    </div>

    <div>
      <div class="url-pill">
        <span>เข้าผ่านลิงก์ย่อ:</span>
        <a href="https://tinyurl.com/ye28a8hs" target="_blank">tinyurl.com/ye28a8hs</a>
      </div>
    </div>

    <div class="steps-list">
      <div class="step-item">
        <div class="step-num">1</div>
        <div>เปิดกล้องสแกน <b>QR Code</b> หรือเข้าผ่านลิงก์ย่อ</div>
      </div>
      <div class="step-item">
        <div class="step-num">2</div>
        <div>เข้าสู่ระบบด้วยอีเมล <b>@mvschool.ac.th</b></div>
      </div>
      <div class="step-item">
        <div class="step-num">3</div>
        <div>กรอกข้อมูลแล้วกด <b>บันทึกข้อมูล</b></div>
      </div>
    </div>
  </div>

  <div class="card-footer">
    * สงวนสิทธิ์เฉพาะครูและบุคลากรโรงเรียนมารีวิทย์บ่อวินเท่านั้น *
  </div>
</div>

<script>
function saveAsImage() {
  const card = document.getElementById("cardToExport");
  const btn = document.querySelector(".btn-action.download");
  const originalText = btn.innerHTML;
  btn.innerHTML = "⏳ กำลังประมวลผลรูปภาพ...";
  
  html2canvas(card, {
    scale: 3, // เพิ่มความละเอียดระดับ High Resolution
    useCORS: true,
    backgroundColor: null
  }).then(canvas => {
    const link = document.createElement("a");
    link.download = "QR-บันทึกพฤติกรรม-ye28a8hs.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    btn.innerHTML = originalText;
  }).catch(err => {
    alert("ระบบไม่สามารถสร้างไฟล์ภาพอัตโนมัติได้ สามารถใช้วิธีแคปเจอร์หน้าจอแทนได้ครับ");
    btn.innerHTML = originalText;
  });
}
</script>

</body>
</html>
