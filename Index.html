<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code บันทึกพฤติกรรมนักเรียน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 30px 16px;
    background: #E8EFEA;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Sarabun', sans-serif;
  }
  .qr-card {
    background: #ffffff;
    width: 360px;
    border-radius: 24px;
    box-shadow: 0 16px 40px rgba(31, 64, 45, 0.18);
    overflow: hidden;
    text-align: center;
    border: 1.5px solid #C8DAD0;
  }
  .card-header {
    background: #1F402D;
    color: #ffffff;
    padding: 24px 20px 20px;
    position: relative;
  }
  .badge {
    display: inline-block;
    background: rgba(255, 255, 255, 0.12);
    color: #D6EAD9;
    font-size: 11.5px;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .card-header h2 {
    font-size: 18px;
    margin: 0;
    font-weight: 700;
  }
  .card-header p {
    font-size: 13px;
    color: #D6EAD9;
    margin: 4px 0 0;
    opacity: 0.9;
  }
  .qr-body {
    padding: 24px 24px 20px;
  }
  .qr-frame {
    background: #F4F8F5;
    padding: 14px;
    border-radius: 18px;
    border: 2px dashed #467055;
    display: inline-block;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.04);
  }
  .qr-frame img {
    width: 220px;
    height: 220px;
    display: block;
    border-radius: 10px;
  }
  .link-pill {
    margin-top: 18px;
    background: #FEF0EB;
    border: 1.5px solid #F05A28;
    padding: 8px 14px;
    border-radius: 50px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .link-pill span {
    font-size: 12px;
    color: #333;
    font-weight: 600;
  }
  .link-pill a {
    color: #F05A28;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
  }
  .instructions {
    margin-top: 14px;
    padding: 10px 14px;
    background: #F9FBF9;
    border-radius: 12px;
    border: 1px solid #E0ECE3;
    font-size: 12px;
    color: #4a6655;
    line-height: 1.5;
  }
  .instructions strong {
    color: #1F402D;
  }
  .footer-note {
    font-size: 11px;
    color: #8fa898;
    padding: 0 0 16px;
  }
</style>
</head>
<body>

<div class="qr-card">
  <div class="card-header">
    <div class="badge">ระบบสารสนเทศฝ่ายปกครอง</div>
    <h2>📋 ระบบบันทึกพฤติกรรมนักเรียน</h2>
    <p>โรงเรียนมารีวิทย์บ่อวิน</p>
  </div>

  <div class="qr-body">
    <div class="qr-frame">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://tinyurl.com/3nma6bm2" alt="QR Code">
    </div>

    <div>
      <div class="link-pill">
        <span>🔗 ลิงก์ย่อ:</span>
        <a href="https://tinyurl.com/3nma6bm2" target="_blank">tinyurl.com/3nma6bm2</a>
      </div>
    </div>

    <div class="instructions">
      สแกนหรือคลิกลิงก์เพื่อเข้าใช้งาน<br>
      <strong>*สงวนสิทธิ์เฉพาะบัญชี @mvschool.ac.th เท่านั้น*</strong>
    </div>
  </div>

  <div class="footer-note">
    เข้าสู่ระบบอัตโนมัติผ่าน Google Account
  </div>
</div>

</body>
</html>
